                        state.scanScope = msg.scope;
                        state.scanPageId = msg.pageId || null;
                        state.statusMessage = null;
                        renderSidebar();
                        if (msg.scope === 'all') showProgress('Starting scan…', 0, 0);
                        if ((msg.scope === 'selection' && state.view.kind === 'selection') ||
                            (msg.scope === 'page' && state.view.kind === 'page' && state.view.pageId === msg.pageId)) {
                            renderMain();
                        }
                        break;

                    case 'selection-report':
                        state.scanning = false;
                        state.selectionReport = { layers: msg.layers, totalLayers: msg.totalLayers };
                        renderSidebar();
                        if (state.view.kind === 'selection') renderMain();
                        break;

                    case 'page-report':
                        state.scanning = false;
                        state.pageReports[msg.pageId] = {
                            pageName: msg.pageName,
                            layers: msg.layers,
                            totalLayers: msg.totalLayers,
                            cached: msg.cached,
                            scannedAt: msg.scannedAt
                        };
                        renderSidebar();
                        if (state.view.kind === 'page' && state.view.pageId === msg.pageId) renderMain();
                        break;

                    case 'page-scanned':
                        upsertPage(Object.assign({ id: msg.pageId }, msg.entry));
                        renderSidebar();
                        if (state.view.kind === 'document') renderMain();
                        break;

                    case 'page-dirty':
                        if (state.pageById[msg.pageId]) state.pageById[msg.pageId].dirty = true;
                        renderSidebar();
                        if (state.view.kind === 'page' && state.view.pageId === msg.pageId) renderMain();
                        break;

                    case 'scan-all-started':
                        state.scanAllSkipped = msg.skipped || 0;
                        showProgress(msg.skipped > 0 ? 'Scanning… (' + msg.skipped + ' already up to date)' : 'Scanning…', 0, msg.total);
                        break;

                    case 'scan-all-progress':
                        showProgress(msg.pageName, msg.current, msg.total);
                        break;

                    case 'scan-all-complete':
                        state.scanning = false;
                        state.scanAllSkipped = msg.skipped || 0;
                        elements.cancelScanBtn.disabled = false;
                        for (var ci = 0; ci < msg.pages.length; ci++) upsertPage(msg.pages[ci]);
                        setTimeout(hideProgress, 300);
                        renderSidebar();
                        if (state.view.kind === 'document') renderMain();
                        break;

                    case 'scan-cancelled':
                        state.scanning = false;
                        elements.cancelScanBtn.disabled = false;
                        hideProgress();
                        renderSidebar();
                        renderMain();
                        break;

                    case 'page-changed':
                        state.currentPageId = msg.pageId;
                        renderSidebar();
                        break;

                    case 'layer-selected':
                        state.selectedLayer = msg.layer;
                        renderMain();
                        break;

                    case 'variable-applied':
                        hideError();
                        state.statusMessage = 'Applied "' + msg.variableName + '" to "' + msg.layerName + '"';
                        if (state.selectedLayer && state.selectedLayer.id === msg.layerId) {
                            state.selectedLayer.hasVariable = true;
                            state.selectedLayer.issueType = 'has_variable';
                            state.selectedLayer.suggestion = { type: 'already_fixed', message: 'Already using variable' };
                        }
                        updateLayerAcrossReports(msg.layerId);
                        renderSidebar();
                        renderMain();
                        break;

                    case 'autofix-complete':
                        hideError();
                        state.statusMessage = 'Autofix complete: ' + msg.totalFixed + ' fixed' + (msg.totalFailed > 0 ? ', ' + msg.totalFailed + ' failed' : '');
                        renderSidebar();
                        renderMain();
                        break;

                    case 'autofix-file-started':
                        state.fixingFile = true;
                        state.autofixPhase = null;
                        state.statusMessage = null;
                        if (msg.snapshotOk) {
                            hideError();
                        } else {
                            showError('Could not save a version history snapshot (' + msg.snapshotError + '). Proceeding anyway — use manual undo if needed.');
                        }
                        showProgress('Preparing…', 0, msg.total);
                        renderMain();
                        break;

                    case 'autofix-file-pass-started':
                        state.autofixPhase = msg.phase;
                        showProgress(phaseLabel(msg.phase) + '…', 0, msg.total);
                        renderMain();
                        break;

                    case 'autofix-file-progress':
                        state.autofixPhase = msg.phase;
                        showProgress(phaseLabel(msg.phase) + ' (' + msg.current + ' / ' + msg.total + ')', msg.current, msg.total);
                        renderMain();
                        break;

                    case 'autofix-file-rescanning':
                        showProgress('Rescanning ' + msg.pageCount + ' changed page' + (msg.pageCount === 1 ? '' : 's') + '…', 0, 0, true);
                        break;

                    case 'autofix-file-complete':
                        state.fixingFile = false;
                        state.autofixPhase = null;
                        hideProgress();
                        state.statusMessage = 'Fixed ' + msg.totalFixed + ' border radius issue' + (msg.totalFixed === 1 ? '' : 's') + ' across ' + msg.totalPages + ' page' + (msg.totalPages === 1 ? '' : 's') + (msg.totalFailed > 0 ? ', ' + msg.totalFailed + ' failed' : '');
                        renderSidebar();
                        renderMain();
                        break;

                    case 'error':
                        showError(msg.message);
                        state.scanning = false;
                        state.fixingFile = false;
                        hideProgress();
                        elements.cancelScanBtn.disabled = false;
                        renderSidebar();
                        renderMain();
                        break;
                }
            });

            function updateLayerAcrossReports(layerId) {
                function patch(list) {
                    if (!list) return;
                    for (var i = 0; i < list.length; i++) {
                        if (list[i].id === layerId) {
                            list[i].hasVariable = true;
                            list[i].issueType = 'has_variable';
                            list[i].suggestion = { type: 'already_fixed', message: 'Already using variable' };
                            break;
                        }
                    }
                }
                if (state.selectionReport) patch(state.selectionReport.layers);
                for (var pid in state.pageReports) patch(state.pageReports[pid].layers);
            }

            // ---------------- initial requests ----------------
            send('load-ignored-names');
            renderSidebar();
            renderMain();
        }
    </script>
</body>
</html>
